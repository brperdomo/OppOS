<!doctype html>
<html><head><meta charset="utf-8"><title>Response document</title>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }
  body { display: flex; flex-direction: column; }
  /* The SDK draws its own toolbar at the top of the editor; ours sits underneath the page. */
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid #e5e7eb; background: #f9fafb; flex: 0 0 auto; }
  .bar button#docx { font-weight: 600; }
  .bar button { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  .bar button:hover { background: #f3f4f6; }
  .bar button:disabled { opacity: .5; cursor: default; }
  .status { margin-left: auto; font-size: 12px; color: #6b7280; }
  #editor, #viewer { flex: 1 1 auto; min-height: 0; position: relative; }
  #viewer { display: none; }
  #viewer iframe { width: 100%; height: 100%; border: 0; }
  body.previewing #editor { display: none; }
  body.previewing #viewer { display: block; }
  .bar button#preview { font-weight: 600; }
</style></head>
<body>
<div class="bar">
  <button id="preview" disabled>Preview PDF</button>
  <button id="docx" disabled>Download as Word (.docx)</button>
  <button id="pdf" disabled>Download as PDF</button>
  <button id="pdfa" disabled>Download as PDF/A (archival)</button>
  <span class="status" id="status">Opening the response document…</span>
</div>
<div id="editor"></div>
<div id="viewer"></div>
<script>
(async () => {
  const status = document.getElementById('status');
  // Payload (markdown, file stem, license key, SDK version) is published by a sibling Streamlit component on the
  // same origin as a <script type="application/json" data-oppos-payload="<id>"> tag; this page is served from the
  // app's own host so the licence can validate, and the URL carries only the payload id (never the content).
  const pid = new URLSearchParams(location.search).get('p');
  // The payload frame is a sibling of ours in the app document — but hosts may wrap component iframes in
  // extra same-origin frames (Streamlit Community Cloud does), so walk every reachable ancestor and search
  // their frame trees; frames we cannot read are not ours.
  const findPayload = () => {
    const sel = 'script[data-oppos-payload="' + pid + '"]';
    const scan = (doc) => {
      for (const f of doc.querySelectorAll('iframe')) {
        try {
          const d = f.contentDocument;
          if (!d || d === document) continue;
          const el = d.querySelector(sel);
          if (el) return el.textContent;
          const deeper = scan(d);
          if (deeper) return deeper;
        } catch (_) { /* cross-origin frame — not ours */ }
      }
      return null;
    };
    try { const el = window.parent.document.querySelector(sel); if (el) return el.textContent; } catch (_) {}
    let w = window;
    for (let i = 0; i < 8; i++) {
      try {
        if (w.parent === w) break;
        w = w.parent;
        const found = scan(w.document);
        if (found) return found;
      } catch (_) { break; /* cross-origin ancestor: nothing above is readable */ }
    }
    return null;
  };
  let cfg = null;
  for (let i = 0; i < 100 && !cfg; i++) {   // the sibling may render a moment after us
    const raw = findPayload();
    if (raw) { try { cfg = JSON.parse(raw); } catch (e) { status.textContent = 'Bad document payload: ' + e.message; return; } }
    else await new Promise(r => setTimeout(r, 100));
  }
  if (!cfg) { status.textContent = 'No document payload found — reload the page.'; return; }
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://document-authoring.cdn.nutrient.io/releases/document-authoring-' + cfg.version + '-umd.js';
    s.onload = resolve; s.onerror = () => reject(new Error('could not load the Document Authoring SDK from the CDN'));
    document.head.appendChild(s);
  }).catch(e => { status.textContent = e.message; throw e; });
  try {
    let system, licenseNote = '';
    if (cfg.licenseKey) {
      try {
        system = await DocAuth.createDocAuthSystem({ licenseKey: cfg.licenseKey });
      } catch (e) {
        // A rejected key (wrong domain, expired) must not leave a dead panel: fall back to the evaluation
        // build (watermarked exports) and say why, so the license can be fixed in Licensor.
        const msg = String(e && e.message || e);
        const m = msg.match(/registered for a different bundle identifier: "([^"]*)" does not match "([^"]*)"/);
        licenseNote = m ? 'license is bound to ' + m[1].replace(/[\^$\\]/g, '') + ', this page is ' + (m[2] || location.hostname)
                        : 'license rejected: ' + msg.split('\n')[0].slice(0, 160);
        console.warn('Document Authoring license rejected, using the evaluation build:', msg);
      }
    }
    if (!system) system = await DocAuth.createDocAuthSystem({});
    // Prefer the Word file (page setup, logo header, footer); the Markdown is the fallback.
    const doc = cfg.docx
      ? await system.import(Uint8Array.from(atob(cfg.docx), ch => ch.charCodeAt(0)), { format: 'docx', fileName: cfg.stem + '.docx' })
      : await system.import(new TextEncoder().encode(cfg.md), { format: 'markdown', fileName: cfg.stem + '.md' });
    const editor = await system.createEditor(document.getElementById('editor'), { document: doc });
    const save = async (format, ext, mime, extra, suffix) => {
      status.textContent = 'Exporting ' + (suffix ? 'PDF/A' : ext.toUpperCase()) + '…';
      try {
        const buf = await editor.currentDocument().export(Object.assign({ format }, extra || {}));
        const url = URL.createObjectURL(new Blob([buf], { type: mime }));
        const a = document.createElement('a'); a.href = url; a.download = cfg.stem + (suffix || '') + '.' + ext; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        status.textContent = (suffix ? 'PDF/A' : ext === 'docx' ? 'Word document' : 'PDF') + ' downloaded — check your Downloads folder';
      } catch (e) { status.textContent = 'Export failed: ' + (e && e.message || e); }
    };
    // Preview: export the PDF in memory and show it in the same frame — Nutrient Web SDK (our viewer) when it
    // loads, the browser's own PDF viewer otherwise. Toggles back to the editor; nothing is downloaded.
    const viewerEl = document.getElementById('viewer');
    const previewBtn = document.getElementById('preview');
    let viewerInstance = null, previewing = false;
    const closePreview = async () => {
      previewing = false; document.body.classList.remove('previewing');
      if (viewerInstance && window.NutrientViewer) { try { await NutrientViewer.unload(viewerEl); } catch (_) {} }
      viewerInstance = null; viewerEl.innerHTML = '';
      previewBtn.textContent = 'Preview PDF'; status.textContent = 'Back to editing';
    };
    const loadViewer = () => new Promise((resolve, reject) => {
      if (window.NutrientViewer) return resolve();
      const s = document.createElement('script');
      s.src = cfg.viewerBase + 'nutrient-viewer.js';
      s.onload = resolve; s.onerror = () => reject(new Error('viewer CDN unreachable'));
      document.head.appendChild(s);
    });
    previewBtn.onclick = async () => {
      if (previewing) return closePreview();
      previewBtn.disabled = true; status.textContent = 'Rendering the PDF preview…';
      try {
        const buf = await editor.currentDocument().export({ format: 'pdf' });
        previewing = true; document.body.classList.add('previewing'); previewBtn.textContent = 'Back to editing';
        try {
          await loadViewer();
          viewerInstance = await NutrientViewer.load(Object.assign(
            { container: viewerEl, document: buf, baseUrl: cfg.viewerBase },
            cfg.viewerLicenseKey ? { licenseKey: cfg.viewerLicenseKey } : {}));
          status.textContent = 'Preview in Nutrient Web SDK' + (cfg.viewerLicenseKey ? '' : ' (trial build — watermarked until VIEWER_LICENSE_KEY is set)')
                             + ' · this is what the PDF download contains';
        } catch (e) {
          console.warn('Nutrient Web SDK preview unavailable, using the browser viewer:', e);
          const url = URL.createObjectURL(new Blob([buf], { type: 'application/pdf' }));
          const f = document.createElement('iframe'); f.src = url; viewerEl.appendChild(f);
          status.textContent = 'Preview (browser PDF viewer) · this is what the PDF download contains';
        }
      } catch (e) { status.textContent = 'Preview failed: ' + (e && e.message || e); await closePreview(); }
      previewBtn.disabled = false;
    };
    document.getElementById('docx').onclick = () => save('docx', 'docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    document.getElementById('pdf').onclick = () => save('pdf', 'pdf', 'application/pdf');
    document.getElementById('pdfa').onclick = () => save('pdf', 'pdf', 'application/pdf', { PDF_A: true }, '-pdfa');
    for (const id of ['preview', 'docx', 'pdf', 'pdfa']) document.getElementById(id).disabled = false;
    status.textContent = licenseNote ? 'Ready (evaluation build, watermarked — ' + licenseNote + ')'
                       : cfg.licenseKey ? 'Ready · licensed for ' + location.hostname
                       : 'Ready (evaluation build — exports carry a watermark until DOCAUTH_LICENSE_KEY is set)';
  } catch (e) {
    status.textContent = 'Could not start the editor: ' + (e && e.message || e);
  }
})();
</script>
</body></html>
